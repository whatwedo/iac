[defaults]
# Local development config — NOT shipped with the collection (see build_ignore
# in galaxy.yml). Consumers bring their own ansible.cfg, so anything relied on
# for safety must live in the roles themselves (e.g. per-task `no_log: true`).

# Resolve `whatwedo.iac.*` from the working tree via the checked-in symlink at
# ../collections/ansible_collections/whatwedo/iac, then fall back to the usual
# locations for externally installed collections. Relative to this directory,
# so run ansible-playbook from `ansible/`.
collections_path = ../collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = ./.galaxy/roles:./roles
interpreter_python = /usr/bin/python3.12
no_log = ${ANSIBLE_NO_LOG:true}
