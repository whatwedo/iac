[defaults]
# Local development config — NOT shipped with the collection (see build_ignore
# in galaxy.yml). Consumers bring their own ansible.cfg, so anything relied on
# for safety must live in the roles themselves (e.g. per-task `no_log: true`).

# Paths are relative to this directory, so run ansible-playbook from `ansible/`.
#
# ORDER IS LOAD-BEARING. `ansible-galaxy collection install` writes to the FIRST
# entry and calls shutil.rmtree on the destination first, so the head of this
# list must always be a disposable directory:
#
#   .galaxy/collections   disposable + gitignored — the install target
#   ../collections        the checked-in symlink -> this directory; read-only,
#                         it is what makes `whatwedo.iac.*` resolve from the
#                         working tree with no rebuild step
#
# Never move `../collections` to the front. Pointing an install at it crashes
# ansible-galaxy ("Cannot call rmtree on a symbolic link"), and pointing one at
# a real path inside this tree would delete the source.
collections_path = .galaxy/collections:../collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = ./.galaxy/roles:./roles
interpreter_python = /usr/bin/python3.12
no_log = ${ANSIBLE_NO_LOG:true}
