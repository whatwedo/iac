name: Collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  build:
    runs-on: ubuntu-latest
    name: build & install
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      # Catches an invalid galaxy.yml and, via build_ignore, an artifact that
      # accidentally ships the dev-only inventory or Molecule scenarios.
      - name: Build the collection
        run: ansible-galaxy collection build --force

      - name: Install the built artifact
        run: |
          ansible-galaxy collection install \
            whatwedo-iac-*.tar.gz -p /tmp/collections

      - name: Verify the installed collection resolves
        run: |
          ANSIBLE_COLLECTIONS_PATH=/tmp/collections \
            ansible-galaxy collection list whatwedo.iac
          test -d /tmp/collections/ansible_collections/whatwedo/iac/roles/sshd

      - name: Verify dev-only files stayed out of the artifact
        run: |
          for path in inventories molecule ansible.cfg; do
            if [ -e "/tmp/collections/ansible_collections/whatwedo/iac/$path" ]; then
              echo "::error::$path was shipped in the collection artifact"
              exit 1
            fi
          done
