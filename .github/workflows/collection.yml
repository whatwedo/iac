name: Collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: ansible

jobs:
  build:
    runs-on: ubuntu-latest
    name: build & install
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pinned to the series declared in ansible/meta/runtime.yml, so the
      # artifact is built and resolved on the oldest ansible-core we claim to
      # support rather than on whatever is newest on PyPI that day.
      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.19,<2.20"

      # Catches an invalid galaxy.yml and, via build_ignore, an artifact that
      # accidentally ships the dev-only inventory or Molecule scenarios.
      # Built outside the source tree so the tarball is never an input to a
      # later step that walks this directory.
      - name: Build the collection
        run: ansible-galaxy collection build --force --output-path "$RUNNER_TEMP/dist"

      # Runs from /tmp on purpose: from `ansible/`, this repo's ansible.cfg is
      # picked up and its collections_path wins over -p, so the artifact lands
      # in the working tree instead of the destination asked for here. Pinning
      # ANSIBLE_COLLECTIONS_PATH as well makes the destination unambiguous.
      - name: Install the built artifact
        working-directory: /tmp
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/collections
        run: |
          ansible-galaxy collection install \
            "$RUNNER_TEMP"/dist/whatwedo-iac-*.tar.gz \
            --collections-path /tmp/collections
          echo "--- what landed where ---"
          find /tmp/collections -mindepth 1 -maxdepth 4

      - name: Verify the installed artifact is complete
        working-directory: /tmp
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/collections
        run: |
          root=/tmp/collections/ansible_collections/whatwedo/iac
          echo "--- installed tree ---"
          ls -la "$root"
          echo "--- collections found (informational) ---"
          ansible-galaxy collection list || true
          test -f "$root/MANIFEST.json"
          test -d "$root/roles/sshd"
          # AGPL-3.0-or-later requires the license text to travel with the work.
          test -f "$root/LICENSE"

      # Resolves the role by FQCN from the installed artifact, exactly as a
      # consumer does. Runs from /tmp so the repo's own ansible.cfg and the
      # working-tree collections symlink cannot mask a broken artifact.
      - name: Verify the role resolves by FQCN
        working-directory: /tmp
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/collections
        run: |
          cat > /tmp/resolve-check.yml <<'PLAY'
          ---
          - name: Resolve the collection role by FQCN
            hosts: localhost
            gather_facts: false
            roles:
              - whatwedo.iac.sshd
          PLAY
          ansible-playbook --syntax-check -i localhost, /tmp/resolve-check.yml

      - name: Verify dev-only files stayed out of the artifact
        run: |
          for path in inventories molecule ansible.cfg .galaxy; do
            if [ -e "/tmp/collections/ansible_collections/whatwedo/iac/$path" ]; then
              echo "::error::$path was shipped in the collection artifact"
              exit 1
            fi
          done
